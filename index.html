<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser Litestream Lab</title>
<style>
  body{font:16px/1.6 system-ui,sans-serif;max-width:960px;margin:48px auto;padding:0 24px;background:#faf9f6;color:#20282b}h1{font-size:32px;letter-spacing:-1px}code,pre,textarea{font-family:ui-monospace,monospace}#context{color:#647169}textarea{box-sizing:border-box;width:100%;min-height:120px;padding:16px;border:1px solid #b3bdb5;border-radius:8px;background:white}button,select{font:inherit;padding:9px 14px;margin:12px 8px 12px 0;border:1px solid #a6b4ac;border-radius:6px;background:white;cursor:pointer}#sync{background:#245d46;color:white}#status{font-weight:600}#error{color:#a32b2b;min-height:26px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef1eb;padding:20px;border-radius:8px;font-size:13px}
</style>
<h1>Browser Litestream Lab</h1>
<p>SQLite WASM / OPFS と MoonBit JS によるオフライン同期の実験。</p>
<p id="context"></p>
<label for="sql">SQL</label>
<textarea id="sql">INSERT INTO notes(id,title) VALUES ('note-1','オフラインで書いたメモ')</textarea>
<div>
<select id="mode" aria-label="同期方式"><option value="changeset">Binary changeset</option><option value="sql">SQL batch</option></select>
<button id="execute">ローカルで実行</button><button id="sync">同期</button>
<button id="discard">未同期変更を破棄して再取得</button>
</div>
<p id="status">SQLite を初期化しています…</p><p id="error" role="alert"></p><pre id="output"></pre>
<script type="module" src="/src/main.ts"></script>
</html>
