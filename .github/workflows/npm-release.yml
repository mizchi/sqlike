name: npm release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check release versions
        run: node scripts/check-npm-release-version.ts "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moon-install.sh"
          bash "$RUNNER_TEMP/moon-install.sh" 0.10.20+65efd5b93
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate packed packages
        run: |
          pnpm test:core
          pnpm test:npm
          pnpm typecheck
      - name: Preserve validated npm archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            generated/npm/*.tgz
            generated/npm/audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish through npm OIDC
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm install --global npm@11.19.1
          pnpm exec tsx scripts/publish-npm-packages.ts --oidc
      - name: Verify anonymous registry consumers
        env:
          SQLIKE_NPM_REGISTRY: '1'
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          pnpm exec tsx --test tests/npm-packages.test.ts
