<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoonBit AOT + LTX</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;max-width:960px;margin:48px auto;padding:0 24px;background:#faf9f6;color:#20282b}h1{font-size:30px}label{display:inline-flex;flex-direction:column;gap:4px;margin:8px 12px 8px 0}input,button{font:inherit;padding:8px 12px;border:1px solid #a6b4ac;border-radius:6px;background:white}button{cursor:pointer;margin:10px 8px 10px 0}#checkpoint{background:#245d46;color:white}#error{color:#a32b2b;min-height:24px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #d6ddd5;padding:10px;overflow-wrap:anywhere}td:nth-child(2){max-width:500px}#pending{padding-left:20px}#pending button{font-size:14px}small{color:#5a685f}#status{font-weight:600}
</style>
<h1>MoonBit AOT + LTX</h1>
<p>メモをオフラインで保存し、SQLite に復元できる LTX を生成します。</p>
<form id="note-form">
<label>ID<input id="note-id" value="1" required pattern="-?[0-9]+"></label>
<label>タイトル<input id="note-title" value="オフラインのメモ" required></label>
<label>スコア<input id="note-score" value="0" type="number" step="1" required></label>
<div><button type="submit">追加</button><button type="button" id="edit">更新</button><button type="button" id="erase">削除</button><button type="button" id="checkpoint">LTX を生成</button></div>
</form>
<p id="status">データベースを初期化しています…</p><p id="error" role="alert"></p>
<table><thead><tr><th>ID</th><th>タイトル</th><th>スコア</th></tr></thead><tbody id="notes"></tbody></table>
<h2>未確認の LTX</h2><ul id="pending"></ul>
<label>保存先<input id="upload-endpoint" aria-label="LTX 保存先" size="40"></label><button type="button" id="upload">LTX を送信</button>
<p><small>送信時は未確認の LTX を先に送り、最新の変更も保存先へ反映します。未確認が128件に達してもメモはローカルへ保存できます。同じ履歴の送信先は初回に固定されます。DO を使う場合は /do-aot-ltx/ルーム名 を指定します。</small></p>
<p><small>初回の snapshot と、その後の差分を順番に使って復元します。ファイルのダウンロードだけでは、復元先が受理したという確認にはしません。</small></p>
<script type="module" src="/src/lite.ts"></script>
</html>
